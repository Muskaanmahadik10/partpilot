name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # tests generate and clean their own data in a temp folder; no API key is needed (mock / offline LLM)
      - run: python -m pytest -q --cov=partpilot --cov-report=xml --cov-report=term
      - run: python data/generate.py && python -m partpilot.clean
      - run: python eval/run_eval.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            reports/cleaning_report.md
            reports/eval_offline_offline.json
      # Coverage upload. Public repos can upload without a token only if the Codecov org setting
      # "Token authentication for public repositories" is off; otherwise add the CODECOV_TOKEN secret.
      # Until then this step may fail; it does not fail CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image and smoke-test first start
        run: |
          docker build -t partpilot .
          docker run -d --name pp -p 8501:8501 -e PARTPILOT_DEMO_PASSWORD=ci-demo-password partpilot
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 3; done
          docker logs pp
          curl -fsS http://localhost:8501/_stcore/health
